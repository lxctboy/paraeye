name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接指定 Gradle 版本，无需提交 wrapper jar；Android Studio 首次同步会本地生成 wrapper
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: assembleDebug

      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: testDebugUnitTest

      - name: Build release APK on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: paraeye-release-apk
          path: paraeye/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: paraeye-debug-apk
          path: paraeye/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
