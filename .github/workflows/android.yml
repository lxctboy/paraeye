name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # tag 构建要把签名 APK 挂到 GitHub Release，默认只读 GITHUB_TOKEN 会 403
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接指定 Gradle 版本，无需提交 wrapper jar；Android Studio 首次同步会本地生成 wrapper
      # 失败时把编译/单测错误摘要写进 job summary（否则只能翻全量日志定位）
      - name: Build debug APK
        id: debugBuild
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: assembleDebug --console=plain
        continue-on-error: true

      - name: Build summary (debug)
        if: ${{ steps.debugBuild.outcome == 'failure' }}
        run: |
          {
            echo "### assembleDebug 失败摘要"
            echo '```'
            grep -nE "^e: |error:|^> Task .*FAILED|What went wrong|Caused by:|Execution failed" \
              paraeye/android/build.log 2>/dev/null | head -40 || echo "(未捕获到 build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        id: unitTests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: testDebugUnitTest --console=plain
        continue-on-error: true

      - name: Test summary
        if: ${{ steps.unitTests.outcome == 'failure' }}
        run: |
          {
            echo "### testDebugUnitTest 失败摘要"
            echo '```'
            grep -nE "^e: |error:|FAILED|tests completed" \
              paraeye/android/build.log 2>/dev/null | head -40 || echo "(未捕获到 build.log)"
            find paraeye/android/app/build/reports/tests -name '*.html' 2>/dev/null \
              | head -5 | sed 's/^/- 报告: /' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 上面两步用 continue-on-error 让摘要步骤能跑；这里做最终判定，避免假绿
      - name: Verify build and tests succeeded
        if: ${{ always() }}
        run: |
          set -uo pipefail
          failed=0
          [ "${{ steps.debugBuild.outcome }}" = "success" ] || failed=1
          [ "${{ steps.unitTests.outcome }}" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::构建或单测未通过（debugBuild=${{ steps.debugBuild.outcome }}, unitTests=${{ steps.unitTests.outcome }}），详见上方摘要"
            exit 1
          fi
          echo "构建与单测均通过"

      # ---- 发布版（仅 tag v* 触发）：解出签名 keystore 后出正式签名包 ----
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PARAKEYSTORE_B64: ${{ secrets.PARAKEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PARAKEYSTORE_B64}" ]; then
            echo "::warning::PARAKEYSTORE_B64 未配置，release 将为未签名包"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$PARAKEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/paraeye.p12"
          echo "keystore bytes: $(stat -c %s "$RUNNER_TEMP/keystore/paraeye.p12")"
          echo "PARAKEYSTORE_PATH=$RUNNER_TEMP/keystore/paraeye.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: gradle/gradle-build-action@v3
        env:
          PARAKEYSTORE_PASSWORD: ${{ secrets.PARAKEYSTORE_PASSWORD }}
          PARAKEY_ALIAS: ${{ secrets.PARAKEY_ALIAS }}
        with:
          gradle-version: '8.11.1'
          build-root-directory: paraeye/android
          arguments: assembleRelease

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=$(ls paraeye/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "apk: $apk ($(stat -c %s "$apk") bytes)"
          echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "apksigner 不可用，跳过签名校验"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk#ParaEye $TAG" --clobber
          else
            gh release create "$TAG" "$apk#ParaEye $TAG" --title "ParaEye $TAG" --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: paraeye-release-apk
          path: paraeye/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: paraeye-debug-apk
          path: paraeye/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
